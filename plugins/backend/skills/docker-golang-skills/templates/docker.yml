# Copiar a .github/workflows/docker.yml
# Build multi-arch + push a GHCR, cacheando capas en el backend `gha`.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # No hace falta setup-qemu-action: el builder corre nativo
      # (--platform=$BUILDPLATFORM) y Go cross-compila hacia $TARGETARCH.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      # OJO: `type=gha` cachea CAPAS, no los --mount=type=cache. En un runner
      # efímero `go mod download` se salta por cache de capa, pero el build cache
      # de Go se pierde entre runs. Para persistirlo también, descomentar el paso
      # buildkit-cache-dance de abajo.
      #
      # - uses: reproducible-containers/buildkit-cache-dance@v3
      #   with:
      #     cache-map: |
      #       {
      #         "go-mod-cache": "/go/pkg/mod",
      #         "go-build-cache": "/root/.cache/go-build"
      #       }
      #     skip-extraction: ${{ steps.meta.outputs.version == '' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
